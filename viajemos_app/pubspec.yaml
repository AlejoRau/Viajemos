name: viajemos_app
description: Viajemos - App de viajes compartidos para Argentina/LATAM
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  riverpod_annotation: ^2.3.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  http: ^1.0.0
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.5.5
  font_awesome_flutter: ^10.7.0
  flutter_native_splash: ^2.4.7
  cached_network_image: ^3.4.1
  intl: any
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  url_launcher: ^6.3.0
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter_native_splash:
  color: "#1A73E8"
  # image: assets/splash/logo.png   # ← descomentar cuando llegue el logo
  color_dark: "#1A73E8"
  # image_dark: assets/splash/logo.png
  android_12:
    color: "#1A73E8"
    # image: assets/splash/logo.png
    color_dark: "#1A73E8"
    # image_dark: assets/splash/logo.png
  fullscreen: false
  android: true
  ios: true

flutter:
  uses-material-design: true
