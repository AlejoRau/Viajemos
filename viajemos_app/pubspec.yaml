publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  riverpod_annotation: ^2.3.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  http: ^1.0.0
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.5.5
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
